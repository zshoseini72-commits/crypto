name: Build apps
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flet
      - run: flet build windows --yes
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: build/windows

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install flet
      - run: flet build apk --yes
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/apk
